name: vimix
base: core26
version: '0.9.3'
summary: Video live mixer
title: vimix
description: |
   vimix performs graphical mixing and blending of several movie clips and
   computer generated graphics, with image processing effects in real-time.
   Its intuitive and hands-on user interface gives direct control on image opacity and
   shape for producing live graphics during concerts and VJ-ing sessions.
   The ouput image is typically projected full-screen on an external
   monitor or a projector, but can be recorded and streamed live (no audio).
contact: https://brunoherbelin.github.io/vimix/
website: https://github.com/brunoherbelin/vimix
issues: https://github.com/brunoherbelin/vimix/issues
source-code: https://github.com/brunoherbelin/vimix.git
icon: snap/gui/vimix.svg
license: GPL-3.0+
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

apps:
  vimix:
    # on core26, the gnome extension also provides the GPU plug
    extensions: [gnome]
    command: usr/bin/launch_vimix.sh
    plugs:
      - desktop
      - desktop-legacy
      - gsettings
      - opengl
      - wayland
      - x11
      - home
      - network
      - avahi-observe
      - camera
      - raw-usb
      - removable-media
      - audio-playback
      - shared-memory
      - joystick
      - screencast-legacy
    # remote control by the desktop (media keys), as org.mpris.MediaPlayer2.vimix
    slots:
      - mpris
    # GStreamer plugins: desktop-launch of the gnome extension sets GST_PLUGIN_PATH to the plugins
    # staged in this snap, and GST_PLUGIN_SYSTEM_PATH and GST_PLUGIN_SCANNER to those of the
    # gnome-core26 platform
    environment:
       LIBDECOR_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor/plugins-1
       FREI0R_PATH: $SNAP/usr/lib/frei0r-1
       LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack

parts:
  vimix-binary:
    plugin: cmake
    source: .
    cmake-parameters:
    - -DCMAKE_INSTALL_PREFIX=/usr
    - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    build-packages:
    -  g++
    -  make
    -  git
    -  libpng-dev
    -  libxrandr-dev
    -  libglfw3-dev
    -  libgstreamer1.0-dev
    -  libgstreamer-plugins-base1.0-dev
    -  libicu-dev
    -  ableton-link-dev
    -  libtinyxml2-dev
    -  libglm-dev
    -  libavahi-client-dev
    -  libxi-dev
    -  libegl-dev
    -  libwayland-dev
    -  wayland-protocols
    -  libvulkan-dev
    stage-packages:
    -  libglu1-mesa
    -  libblas3
    -  liblapack3
    -  libglfw3
    -  libdecor-0-0
    -  libdecor-0-plugin-1-gtk
    -  frei0r-plugins
    -  libgstreamer1.0-0
    -  libgstreamer-gl1.0-0
    -  libgstreamer-plugins-base1.0-0
    -  libgstreamer-plugins-bad1.0-0
    -  gstreamer1.0-libav
    -  gstreamer1.0-x
    -  gstreamer1.0-gl
    -  gstreamer1.0-pipewire
    -  gstreamer1.0-plugins-base
    -  gstreamer1.0-plugins-good
    -  gstreamer1.0-plugins-bad
    -  gstreamer1.0-plugins-ugly
    -  libgpm2
    -  libslang2
    -  libicu78
    -  libtinyxml2-11
    -  pciutils
    -  libavahi-client3
