# Manual macOS build of vimix (Apple Silicon, minimum macOS 15, unsigned)
# Run it from the "Actions" tab > "macOS build" > "Run workflow" (pick the branch there).
name: macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOS_MIN_VERSION: "15.0"

jobs:
  build:
    # macos-15 is an arm64 runner: Homebrew bottles installed here target macOS 15
    runs-on: macos-15

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          # minimum + recommended + optional (see docs/README.md), plus ninja
          brew install ninja cmake pkgconf libpng glfw gstreamer icu4c frei0r onnxruntime glm tinyxml2

      - name: Configure
        run: |
          # Empty APPLE_CODESIGN_IDENTITY disables signing in BundleInstall.cmake
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOS_MIN_VERSION} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DAPPLE_CODESIGN_IDENTITY=

      - name: Build
        run: cmake --build build -j

      - name: Package (dmg)
        working-directory: build
        run: cpack

      - name: Check minimum macOS version of bundled binaries
        run: |
          # Mount the dmg and list the minos of every Mach-O in the app bundle
          DMG=$(ls build/*.dmg | head -n 1)
          echo "Package: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/vimix-dmg -nobrowse -quiet
          find /tmp/vimix-dmg -type f \( -name "*.dylib" -o -name "*.so" -o -perm -u+x \) | while read -r f; do
            minos=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')
            [ -n "$minos" ] && echo "$minos $f"
          done | sort -V | tail -n 15
          hdiutil detach /tmp/vimix-dmg -quiet

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: vimix-macos-${{ env.MACOS_MIN_VERSION }}-arm64
          path: build/*.dmg
          if-no-files-found: error
